<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project | Huzentra Technologies</title>

  <meta
    name="description"
    content="Explore a project developed by Huzentra Technologies."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="projects">

<header id="site-header"></header>

<main id="project-detail">

  <section class="inner-hero project-detail-hero">

    <div class="background-grid"></div>

    <div class="container narrow">

      <span class="eyebrow" id="project-status">
        PROJECT
      </span>

      <h1 id="project-title">
        Project
      </h1>

      <p id="project-summary"></p>

      <div
        class="technology-tags project-tech"
        id="project-technologies"
      ></div>

    </div>

  </section>


  <section class="section">

    <div class="container project-detail-grid">

      <div>

        <span class="section-label">
          OVERVIEW
        </span>

        <h2 id="project-heading">
          Project Overview
        </h2>

      </div>

      <div class="project-detail-copy">

        <p id="project-description"></p>

        <div class="project-information">

          <div>
            <small>Status</small>
            <strong id="project-progress"></strong>
          </div>

          <div>
            <small>Type</small>
            <strong id="project-type"></strong>
          </div>

        </div>

      </div>

    </div>

  </section>


  <section class="section section-soft">

    <div class="container">

      <div class="section-heading">
        <span class="section-label">
          KEY FEATURES
        </span>

        <h2>
          What the product
          <span>includes.</span>
        </h2>
      </div>

      <div
        class="cards-grid three"
        id="project-features"
      ></div>

    </div>

  </section>


  <section class="section">

    <div class="container">

      <a href="projects.html" class="btn btn-outline-dark">
        ← Back to Projects
      </a>

    </div>

  </section>

</main>

<footer id="site-footer"></footer>

<script src="js/script.js"></script>

</body>
</html>
